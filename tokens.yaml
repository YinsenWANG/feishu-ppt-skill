# Theme colors and review policy. The whitelist is derived from colors.
# Copy this complete file and pass --tokens to select a different brand.
schema_version: 1
theme: Cherry Studio (default; replace with --tokens for another brand)
colors:
  brand_coral:
    hex: '#FF5A5F'
    rgba: rgba(255,90,95,1)
    role: 品牌强调/结论/甲方
  brand_black:
    hex: '#171717'
    rgba: rgba(23,23,23,1)
    role: 标题/正文/图标线条；默认主题不用作填充
